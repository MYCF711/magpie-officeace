name: release

# 从 CHANGELOG.md 里抽该版本那几条，建成 GitHub Release。
#
# 为什么要有这个：Release 的正文就是「更新内容，一条条列出来」——
# 手工复制迟早会漏，而正文与 CHANGELOG 分家就会互相打架。
# 机制见 UPDATING.md；这里只做一件事：CHANGELOG 是唯一来源，Release 是它的投影。
#
# ⚠ 这个 workflow 不参与 magpie 的更新检测（那是 push 默认分支 + npm publish 的事）。
#   Release 是给人看的。
#
# ⚠ **不随 tag 自动跑**（2026-11-20 起）。npm 发布和 Release 都由本地一步做完：
#   推 tag 会同时触发这里和本地的 `npm run publish:npm`，两边发布撞车 —— 本地刚推完、
#   registry 还没登记该版本，守卫里的 `npm view` 查不到 ⇒ 当成首发 ⇒
#   409 "Cannot publish over previously staged version"，每次发版多一封失败邮件。
#   要建/刷新 Release 就在 Actions 页面手动跑一次（或 `gh workflow run release.yml -f tag=v0.3.4`）。
#   别用「删 tag 再重推」：GitHub 删 tag 时会把它的 Release 转成草稿（网页上就看不见了）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要建 / 刷新的 tag，例如 v0.3.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 只允许发布已合并且验证通过的提交
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$REF_NAME" = "$expected"
          git fetch origin "$DEFAULT_BRANCH" --quiet
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          elif compgen -G 'tests/*.test.mjs' > /dev/null; then
            node --test tests/*.test.mjs
          elif [ -f tests/smoke.mjs ]; then
            node tests/smoke.mjs
          else
            echo "没有可自动运行的语义测试" >&2
            exit 1
          fi
          npm pack --dry-run

  release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 从 CHANGELOG.md 抽出这个版本的条目
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF_NAME#v}"

          if [ ! -f CHANGELOG.md ]; then
            echo "没有 CHANGELOG.md —— Release 正文留空" >&2
            printf '见仓库根目录的 CHANGELOG.md。\n' > notes.md
            exit 0
          fi

          # 取 "## <ver>" 那一节，到下一个 "## " 之前；去掉空行
          awk -v ver="$ver" '
            /^## / {
              if (f) exit
              if (substr($0, 4, length(ver)) == ver) { f = 1; next }
            }
            f { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md 里没有 $ver 这一节" >&2
            printf '见仓库根目录的 CHANGELOG.md。\n' > notes.md
          fi

          echo "--- Release 正文 ---"
          cat notes.md

      - name: 建 Release（已存在则刷新正文）
        env:
          GH_TOKEN: ${{ github.token }}
          # ⚠ 手动触发时 `GITHUB_REF_NAME` 是**分支名**（main），不是 tag ——
          #   2026-11-26 就这么建出过一个 tag=main 的 Release。这里和上面两步一样，
          #   优先用 inputs.tag，没有才退回 ref_name（push tag 触发时才走那条路）。
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${REF_NAME:-}"
          # 重推同一个 tag 时刷新，而不是报错 —— CHANGELOG 改了，Release 就跟着改
          # ⚠ --draft=false 是必需的：tag 被删过的话，GitHub 会把 Release 转成草稿，
          #   而 `gh release view` 看得见草稿 —— 于是走 edit 分支，草稿就一直是草稿。
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release edit "$REF_NAME" \
              --title "$REF_NAME" \
              --notes-file notes.md \
              --draft=false
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --notes-file notes.md
          fi

      - name: Publish to npm（有 NPM_TOKEN 才发）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "没有 NPM_TOKEN，跳过 npm 发布（Release 已建）"
            exit 0
          fi
          ver="$(node -p "require('./package.json').version")"
          if npm view "officeace-auth@${ver}" version >/dev/null 2>&1; then
            echo "officeace-auth@${ver} 版本已存在（already published），跳过重复发布"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          # `npm view` 查不到 ≠ 没发过：npm 注册有 1-2 分钟延迟，本地 `publish:npm`
          # 抢在前面时守卫会失效，于是这里回 409。409 的含义就是「这版已经在了」，
          # 和守卫命中等价 —— 按成功收，别让它把整次运行染红。
          set +e
          out="$(npm run publish:npm 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ $code -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$out" | grep -qE 'E409|Cannot publish over previously staged version'; then
            echo "officeace-auth@${ver} 已由本地发布（409），按成功收"
            exit 0
          fi
          exit $code
